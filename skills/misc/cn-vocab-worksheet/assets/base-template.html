<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <style>
        @media print {
            body {
                margin: 0;
                padding: 15mm;
            }
            .no-break {
                page-break-inside: avoid;
            }
        }

        body {
            font-family: 'Times New Roman', serif;
            max-width: 210mm;
            margin: 0 auto;
            padding: 0 15mm;
            background: white;
            color: #000;
        }

        h1 {
            text-align: center;
            font-size: 16pt;
            margin-bottom: 10px;
            border-bottom: 3px solid #000;
            padding-bottom: 10px;
        }

        h2 {
            font-size: 12pt;
            margin-top: 25px;
            margin-bottom: 15px;
            background: #f0f0f0;
            padding: 8px;
            border-left: 5px solid #333;
        }

        .word-section {
            margin-bottom: 15px;
        }

        /* Each PDF row → one flex row */
        .word-row {
            display: flex;
            gap: 4px 6px;
            margin-bottom: 4px;
        }

        /* Used by 重点单词 (equal-width columns) */
        .word-item {
            flex: 1 1 0;
            padding: 3px 2px;
        }

        /* Used by 单词 and 词组 (natural-width columns, subtle card) */
        .phrase-item {
            flex: 1 1 auto;
            padding: 4px 5px;
            background: #fafafa;
            border-radius: 3px;
        }

        .english {
            font-size: 11pt;
            font-weight: bold;
            white-space: nowrap;
        }

        .chinese {
            font-size: 9pt;
            color: #333;
        }

        /* 句子 */
        .sentence-item {
            margin-bottom: 8px;
            padding: 6px;
            background: #f5f5f5;
        }

        .sentence-english {
            font-size: 11pt;
            font-weight: bold;
            margin-bottom: 3px;
            line-height: 1.4;
        }

        .sentence-chinese {
            font-size: 9pt;
            color: #444;
            line-height: 1.3;
        }

        /* 语法知识 */
        .grammar-section {
            margin-bottom: 15px;
        }

        .grammar-subtitle {
            font-size: 11pt;
            font-weight: bold;
            margin: 12px 0 6px 0;
        }

        .grammar-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 10pt;
            margin-bottom: 8px;
        }

        .grammar-table th,
        .grammar-table td {
            border: 1px solid #999;
            padding: 5px 8px;
            text-align: center;
        }

        .grammar-table th {
            background: #f0f0f0;
            font-weight: bold;
        }

        .grammar-table td:first-child {
            background: #f0f0f0;
            font-weight: bold;
            text-align: left;
        }

        .grammar-formula {
            font-size: 10pt;
            margin: 6px 0 4px 0;
        }

        .grammar-note {
            font-size: 10pt;
            margin: 10px 0 4px 0;
        }

        .grammar-note p {
            margin: 4px 0;
            line-height: 1.6;
        }

        .grammar-note .rule-title {
            font-weight: bold;
            margin-top: 8px;
        }

        .grammar-note .example {
            margin-left: 12px;
            color: #222;
        }

        .grammar-note .warning {
            margin-top: 8px;
            font-weight: bold;
        }

        /* Embedded PDF images (for grammar charts, special layouts, etc.) */
        .pdf-image-block {
            margin: 10px 0;
            text-align: center;
        }

        .pdf-image {
            max-width: 100%;
            height: auto;
            border: 1px solid #ccc;
            background: #fff;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 10px;
            border-top: 2px solid #000;
            font-size: 10pt;
            color: #666;
        }
    </style>
</head>
<body>
    <h1>{{TITLE}}</h1>

    <!--
    =====================================================================
    SECTION PATTERNS — copy and repeat as needed
    =====================================================================

    ── 重点单词 / 单词 (word-item = equal cols; phrase-item = natural cols) ──

    <div class="word-section no-break">
        <h2>重点单词</h2>
        <div class="word-row">
            <div class="word-item">
                <div class="english">school bag</div>
                <div class="chinese">书包</div>
            </div>
            ... (add spacer <div class="word-item"></div> for incomplete last row)
        </div>
    </div>

    <div class="word-section no-break">
        <h2>单词</h2>
        <div class="word-row">
            <div class="phrase-item">
                <div class="english">mine</div>
                <div class="chinese">我的</div>
            </div>
            ... (no spacers needed — rows end naturally)
        </div>
    </div>

    ── 词组 ──

    <div class="word-section no-break">
        <h2>词组</h2>
        <div class="word-row">
            <div class="phrase-item">
                <div class="english">tidy up</div>
                <div class="chinese">整理</div>
            </div>
            ...
        </div>
    </div>

    ── 句子 ──

    <div class="word-section">
        <h2>句子</h2>
        <div class="sentence-item">
            <div class="sentence-english">1. What a mess!</div>
            <div class="sentence-chinese">多么乱呀！</div>
        </div>
        ...
    </div>

    ── 语法知识 (with table) ──

    <div class="grammar-section">
        <h2>语法知识</h2>
        <div class="grammar-subtitle">2. 名词性物主代词与形容词性物主代词</div>
        <table class="grammar-table">
            <thead>
                <tr><th></th><th>我的</th>...</tr>
            </thead>
            <tbody>
                <tr><td>名词性物主代词</td><td>mine</td>...</tr>
                <tr><td>形容词性物主代词</td><td>my</td>...</tr>
            </tbody>
        </table>
        <div class="grammar-formula">名词性物主代词 ＝ 形容词性物主代词 ＋ 名词</div>
        <div class="grammar-note">
            <p class="rule-title">1、...</p>
            <p class="example">例：...</p>
            <p class="warning">★ 注意：...</p>
        </div>
    </div>

    ── 语法知识 (text only, no table) ──

    <div class="grammar-section">
        <h2>语法知识</h2>
        <div class="grammar-note">
            <p class="rule-title">1、...</p>
            <p class="example">例：...</p>
        </div>
    </div>

    ── Embedded image block (from detect_images.py snippets) ──

    <div class="grammar-section">
        <h2>语法知识</h2>
        <div class="pdf-image-block no-break">
            <img src="./images/m1u1/image-01-obj12.jpg" alt="Grammar chart" class="pdf-image" />
        </div>
    </div>

    =====================================================================
    -->

    <div class="footer">{{TITLE}}</div>
</body>
</html>
