<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>一周学习计划</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #5f6878;
      --paper: #fff;
      --blue: #1685b5;
      --blue-soft: #eaf7fc;
      --purple: #8c35bd;
      --purple-soft: #f7edfc;
      --green: #4f8628;
      --green-soft: #f1f8e9;
      --orange: #df641f;
    }

    * { box-sizing: border-box; }

    @page { size: A4 landscape; margin: 0; }

    body {
      margin: 0;
      background: #e8ebef;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 12.5px;
      line-height: 1.35;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .sheet {
      width: 297mm;
      height: 210mm;
      margin: 12px auto;
      padding: 8mm 9mm 7mm;
      overflow: hidden;
      background: var(--paper);
      box-shadow: 0 8px 30px rgba(23, 32, 51, .16);
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 10mm;
      margin-bottom: 4mm;
      padding-bottom: 3mm;
      border-bottom: 2px solid var(--ink);
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.05;
      letter-spacing: .04em;
    }

    .start-time {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 2mm;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }

    .clock {
      display: inline-grid;
      width: 19px;
      height: 19px;
      place-items: center;
      border: 2px solid var(--orange);
      border-radius: 50%;
      color: var(--orange);
      font-size: 9px;
    }

    .start-time strong { color: var(--orange); font-size: 17px; }

    .student-info {
      display: grid;
      grid-template-columns: auto 34mm auto 34mm;
      gap: 2mm;
      align-items: end;
      color: var(--muted);
      font-weight: 650;
      white-space: nowrap;
    }

    .write-line { height: 6mm; border-bottom: 1.5px solid #758094; }
    section + section { margin-top: 3.2mm; }

    .section-title {
      display: flex;
      align-items: center;
      gap: 2mm;
      margin: 0 0 2mm;
      font-size: 15px;
      line-height: 1;
    }

    .step {
      display: inline-grid;
      width: 6mm;
      height: 6mm;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
    }

    .must .step { background: var(--blue); }
    .extra .step { background: var(--purple); }

    .section-note { color: var(--muted); font-size: 11px; font-weight: 500; }

    table { width: 100%; border-collapse: separate; border-spacing: 0; }

    .daily-table {
      overflow: hidden;
      border: 1px solid #a8d6e8;
      border-radius: 8px;
      background: #fff;
    }

    .daily-table th,
    .daily-table td {
      height: 8.2mm;
      padding: 1.2mm 2mm;
      border-right: 1px solid #d9e6ec;
      border-bottom: 1px solid #d9e6ec;
      vertical-align: middle;
    }

    .daily-table tr:last-child td { border-bottom: 0; }
    .daily-table th:last-child,
    .daily-table td:last-child { border-right: 0; }

    .daily-table thead th {
      height: 8mm;
      background: var(--blue-soft);
      color: #165f7d;
      font-weight: 800;
      text-align: center;
    }

    .daily-table .subject-head { width: 17mm; }
    .daily-table .task-head { text-align: left; }
    .daily-table .day-head { width: 15mm; }

    .subject {
      border-left: 4px solid var(--blue);
      background: #f6fbfd;
      color: #145e7d;
      font-size: 13px;
      font-weight: 800;
      text-align: center;
    }

    .task { color: var(--blue); font-size: 12.5px; font-weight: 650; }
    .duration {
      margin-left: 1mm;
      color: var(--muted);
      font-size: 10.5px;
      font-weight: 500;
      white-space: nowrap;
    }
    .task .duration { color: var(--blue); }
    .check-cell { text-align: center; }

    .box {
      display: inline-block;
      width: 4.2mm;
      height: 4.2mm;
      border: 1.5px solid #6f7a8d;
      border-radius: 2px;
      vertical-align: middle;
    }

    .extra-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-auto-rows: 1fr;
      gap: 2.5mm;
    }

    .day-card {
      display: flex;
      overflow: hidden;
      flex-direction: column;
      border: 1px solid #cbd3df;
      border-radius: 8px;
      break-inside: avoid;
    }

    .day-card h3 {
      display: flex;
      align-items: center;
      min-height: 7mm;
      margin: 0;
      padding: 1mm 2.5mm;
      border-bottom: 1px solid #d8dde5;
      background: #f3f5f8;
      color: var(--ink);
      font-size: 13px;
    }

    .day-name { color: #67268b; font-size: 15px; font-weight: 850; }

    .subject-tags { display: inline-flex; gap: 1mm; margin-left: auto; }
    .subject-tag {
      padding: .8mm 1.8mm;
      border-radius: 99px;
      background: var(--purple-soft);
      color: #67268b;
      font-size: 10px;
      font-weight: 800;
    }

    .task-list {
      display: flex;
      flex: 1;
      flex-direction: column;
      justify-content: center;
      margin: 0;
      padding: 1mm 2.2mm;
      list-style: none;
    }

    .task-list li {
      min-height: 5.4mm;
      padding: .35mm 0;
      border-bottom: 1px dashed #d8dde5;
      font-weight: 650;
    }

    .task-list li:last-child { border-bottom: 0; }

    .single-task-row {
      display: grid;
      grid-template-columns: 5mm 1fr auto;
      align-items: center;
      gap: 1.5mm;
    }

    .task-number {
      display: inline-grid;
      width: 4.5mm;
      height: 4.5mm;
      place-items: center;
      border-radius: 50%;
      font-size: 9px;
      font-weight: 850;
    }

    .purple-task,
    .purple-task .duration { color: var(--purple); }
    .green-task,
    .green-task .duration { color: var(--green); }
    .purple-task .task-number { background: var(--purple-soft); color: var(--purple); }
    .green-task .task-number { background: var(--green-soft); color: var(--green); }
    .purple-task .box { border-color: var(--purple); }
    .green-task .box { border-color: var(--green); }

    .sunday-note {
      display: inline-flex;
      align-items: center;
      margin-left: auto;
      padding: 1mm 2.5mm;
      border: 1px dashed #b9c1cc;
      border-radius: 99px;
      color: var(--muted);
      font-size: 10.5px;
      font-weight: 600;
    }

    .empty-day { margin: auto; color: var(--muted); font-weight: 650; }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.5mm;
      color: var(--muted);
      font-size: 10px;
    }

    .legend { display: flex; gap: 4mm; }
    .legend span { display: inline-flex; align-items: center; gap: 1mm; }
    .dot { width: 3mm; height: 3mm; border-radius: 50%; }
    .dot.blue { background: var(--blue); }
    .dot.purple { background: var(--purple); }
    .dot.green { background: var(--green); }
    .encouragement { color: var(--ink); font-weight: 750; letter-spacing: .04em; }

    @media print {
      body { background: #fff; }
      .sheet { margin: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <main class="sheet">
    <header>
      <div>
        <h1 id="plan-title"></h1>
        <div class="start-time">
          <span class="clock">●</span>
          每晚 <strong id="start-time"></strong> 开始
        </div>
      </div>
      <div class="student-info" aria-label="填写姓名和本周日期">
        <span>姓名</span><span class="write-line"></span>
        <span>本周</span><span class="write-line"></span>
      </div>
    </header>

    <section class="must" aria-labelledby="must-title">
      <h2 class="section-title" id="must-title">
        <span class="step">1</span>
        每天必做
        <span class="section-note">无论星期几，都要完成；做完一项就打一个 ✓</span>
      </h2>
      <table class="daily-table">
        <thead>
          <tr>
            <th class="subject-head">科目</th>
            <th class="task-head">任务</th>
            <th class="day-head">周一</th>
            <th class="day-head">周二</th>
            <th class="day-head">周三</th>
            <th class="day-head">周四</th>
            <th class="day-head">周五</th>
            <th class="day-head">周六</th>
            <th class="day-head">周日</th>
          </tr>
        </thead>
        <tbody id="daily-body"></tbody>
      </table>
    </section>

    <section class="extra" aria-labelledby="extra-title">
      <h2 class="section-title" id="extra-title">
        <span class="step">2</span>
        今天还要做
        <span class="section-note">找到今天的卡片；同一组任务会在两个对应日重复显示</span>
        <span class="sunday-note">周日：完成上面的“每天必做”</span>
      </h2>
      <div class="extra-grid" id="extra-grid"></div>
    </section>

    <footer>
      <div class="legend" aria-label="颜色说明">
        <span><i class="dot blue"></i>每天必做</span>
        <span><i class="dot purple"></i>加练任务</span>
        <span><i class="dot green"></i>写作／单元测试</span>
      </div>
      <div class="encouragement">每天完成一点点，一周就会进步很多！</div>
    </footer>
  </main>

  <script>
    // Replace this data block. Keep the renderer and print styles unchanged.
    const PLAN = {
      title: "我的一周晚间学习计划",
      startTime: "7:00—7:30",
      dailyGroups: [
        { subject: "语文", tasks: [
          { text: "读背知识点", detail: "10～20分钟" },
          { text: "阅读课外读物", detail: "10～30分钟" },
          { text: "默写", detail: "一课 · 10分钟" }
        ]},
        { subject: "英语", tasks: [
          { text: "听读课文三遍", detail: "10分钟" },
          { text: "默写", detail: "一天一课 · 10分钟" },
          { text: "打卡", detail: "30分钟" }
        ]},
        { subject: "数学", tasks: [
          { text: "计算题", detail: "10分钟" }
        ]}
      ],
      scheduledGroups: [
        { subject: "英语", days: ["周一", "周四"], tasks: [
          { number: "4", tone: "purple", text: "听力练习一套", detail: "10～15分钟" },
          { number: "5", tone: "purple", text: "基础题", detail: "15分钟" },
          { number: "6", tone: "purple", text: "阅读理解", detail: "15分钟" },
          { number: "7", tone: "green", text: "作文练笔", detail: "20分钟" },
          { number: "8", tone: "green", text: "单元测试卷", detail: "一周一次" }
        ]},
        { subject: "数学", days: ["周二", "周五"], tasks: [
          { number: "2", tone: "purple", text: "单元测试卷", detail: "一周两次" }
        ]},
        { subject: "语文", days: ["周三", "周六"], tasks: [
          { number: "4", tone: "purple", text: "基础题", detail: "15分钟" },
          { number: "5", tone: "purple", text: "阅读理解", detail: "一篇 · 20分钟" },
          { number: "6", tone: "purple", text: "文言文阅读", detail: "一篇 · 20分钟" },
          { number: "7", tone: "green", text: "写作、小练笔" },
          { number: "8", tone: "green", text: "单元测试卷", detail: "一周一次" }
        ]}
      ]
    };

    const CARD_DAYS = ["周一", "周二", "周三", "周四", "周五", "周六"];

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function detailSpan(text) {
      return text ? element("span", "duration", text) : null;
    }

    document.title = PLAN.title;
    document.getElementById("plan-title").textContent = PLAN.title;
    document.getElementById("start-time").textContent = PLAN.startTime;

    const dailyBody = document.getElementById("daily-body");
    for (const group of PLAN.dailyGroups) {
      group.tasks.forEach((task, taskIndex) => {
        const row = document.createElement("tr");
        if (taskIndex === 0) {
          const subject = element("td", "subject", group.subject);
          subject.rowSpan = group.tasks.length;
          row.appendChild(subject);
        }

        const taskCell = element("td", "task", task.text);
        const detail = detailSpan(task.detail);
        if (detail) taskCell.appendChild(detail);
        row.appendChild(taskCell);

        for (let day = 0; day < 7; day += 1) {
          const checkCell = element("td", "check-cell");
          checkCell.appendChild(element("span", "box"));
          row.appendChild(checkCell);
        }
        dailyBody.appendChild(row);
      });
    }

    const extraGrid = document.getElementById("extra-grid");
    for (const day of CARD_DAYS) {
      const groups = PLAN.scheduledGroups.filter(group => group.days.includes(day));
      const card = element("article", "day-card");
      const heading = document.createElement("h3");
      heading.appendChild(element("span", "day-name", day));

      const tags = element("span", "subject-tags");
      for (const group of groups) tags.appendChild(element("span", "subject-tag", group.subject));
      heading.appendChild(tags);
      card.appendChild(heading);

      if (groups.length === 0) {
        card.appendChild(element("p", "empty-day", "今天没有加做任务"));
      } else {
        const list = element("ul", "task-list");
        for (const group of groups) {
          for (const task of group.tasks) {
            const item = element("li", `${task.tone}-task`);
            const row = element("div", "single-task-row");
            row.appendChild(element("span", "task-number", task.number || "•"));
            const label = element("span", "", task.text);
            const detail = detailSpan(task.detail);
            if (detail) label.appendChild(detail);
            row.appendChild(label);
            row.appendChild(element("span", "box"));
            item.appendChild(row);
            list.appendChild(item);
          }
        }
        card.appendChild(list);
      }
      extraGrid.appendChild(card);
    }
  </script>
</body>
</html>
